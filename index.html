<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karty Pracy - Zbrodnia i Kara</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #ddd;
            --button-bg: #007bff;
            --button-hover: #0056b3;
            --accent: #6c63ff;
        }

        body.dark-mode {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #444;
            --button-bg: #0d6efd;
            --button-hover: #0a58ca;
            --accent: #8b84ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .title-section h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent), var(--button-bg));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle span {
            font-size: 1.5em;
        }

        /* Main Menu */
        .main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            min-height: 60vh;
        }

        .menu-title {
            font-size: 2em;
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .button-group {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button, a.button {
            padding: 20px 50px;
            font-size: 1.3em;
            font-weight: 600;
            background: linear-gradient(135deg, var(--button-bg), var(--accent));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            display: inline-block;
        }

        button:hover, a.button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active, a.button:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
                gap: 20px;
            }

            button, a.button {
                padding: 15px 40px;
                font-size: 1.1em;
                width: 100%;
            }

            .title-section h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="title-section">
            <h1>📚 Zbrodnia i Kara</h1>
            <div class="subtitle">Karty pracy - Fiodor Dostojewski</div>
        </div>
        <div class="theme-toggle" id="themeToggle">
            <span id="themeIcon">🌙</span>
            <span id="themeLabel">Ciemny</span>
        </div>
    </header>

    <div class="content">
        <div class="main-menu">
            <h2 class="menu-title">Wybierz grupę</h2>
            <div class="button-group">
                <a href="grupa1.html" class="button">👥 Grupa 1</a>
                <a href="grupa2.html" class="button">👥 Grupa 2</a>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');

        // Check for saved theme preference or default to light mode
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
            themeLabel.textContent = 'Jasny';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            themeIcon.textContent = isDarkMode ? '☀️' : '🌙';
            themeLabel.textContent = isDarkMode ? 'Jasny' : 'Ciemny';
        });
    </script>
</body>
</html>
